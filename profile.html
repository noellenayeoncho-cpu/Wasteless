<h1>Profile</h1>
<div class="profile-card">
    <h3>Your information</h3>
            <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="role">I am a...</label>
        <select id="role">
            <option value="Donor">Donor</option>
            <option value="Recipient">Person looking for food</option>
            <option value="Both">Both a donor and recipient</option>
        </select>

        <label for="about">About me</label>
        <textarea id="about" placeholder="Tell us a little about yourself"></textarea>

        <button onclick="saveProfile()">Save Profile</button>

        <p id="message"></p>
    </div>

    <script>
        function saveProfile() {
            let profile = {
                name: document.getElementById("name").value.trim(),
                role: document.getElementById("role").value,
                about: document.getElementById("about").value.trim()
            };

            localStorage.setItem("profile", JSON.stringify(profile));

            document.getElementById("message").textContent =
                "Profile saved!";
        }

        function loadProfile() {
            let profile = JSON.parse(localStorage.getItem("profile") || "{}");

            document.getElementById("name").value = profile.name || "";
            document.getElementById("role").value = profile.role || "Donor";
            document.getElementById("about").value = profile.about || "";
        }

        loadProfile();
    </script>
</body>
