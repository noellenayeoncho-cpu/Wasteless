    <h2> Donate</h2>
<button class="floating-add" onclick="togglePost()">+</button>

<div id="post-popup" class="post-popup">
    <h3>Share a Donation</h3>
    <textarea id="post-text" placeholder="Wanna donate?"></textarea>
    <button onclick="addPost()">Post</button>
</div>

<div id="posts"></div>


<script>
    function togglePost() {
        const popup = document.getElementById("post-popup");
        popup.style.display =
            popup.style.display === "block" ? "none" : "block";
    }

    function addPost() {
        const input = document.getElementById("post-text");
        const text = input.value.trim();

        if (text === "") return;

        let posts = JSON.parse(localStorage.getItem("donationPosts") || "[]");
        posts.unshift(text);
        localStorage.setItem("donationPosts", JSON.stringify(posts));

        input.value = "";
        document.getElementById("post-popup").style.display = "none";
        showPosts();
    }

    function showPosts() {
        const container = document.getElementById("posts");
        const posts = JSON.parse(localStorage.getItem("donationPosts") || "[]");

        container.innerHTML = "";

        posts.forEach(function(text) {
            const post = document.createElement("div");
            post.className = "simple-post";
            post.textContent = text;
            container.appendChild(post);
        });
    }

    showPosts();
</script>
