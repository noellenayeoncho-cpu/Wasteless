<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches | WasteLess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>WasteLess</h1>
    </header>

    <nav>
        <a href="main.html">Home</a>
        <a href="needs.html">Needs</a>
        <a href="matches.html">Matches</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="donate.html">Donate</a>
        <a href="messages.html">Messages</a>
    </nav>

    <main>
        <h1>Matches</h1>
        <p>Connecting donations with people who need them!</p>

        <div id="matches-list"></div>
    </main>

    <script>
        function getSavedData(key) {
            try {
                let data = JSON.parse(localStorage.getItem(key));
                return Array.isArray(data) ? data : [];
            } catch {
                return [];
            }
        }

        function getPostText(post) {
            if (typeof post === "string") {
                return post;
            }

            return String(
                post.text ||
                post.description ||
                post.food ||
                post.name ||
                post.item ||
                ""
            );
        }

        function findMatches() {
            let donations = getSavedData("donationPosts");
            let needs = getSavedData("needPosts");
            let matches = [];

            donations.forEach(function(donation) {
                needs.forEach(function(need) {
                    let donationText = getPostText(donation);
                    let needText = getPostText(need);

                    let donationWords = donationText.toLowerCase()
                        .match(/[a-z0-9]+/g) || [];

                    let needWords = needText.toLowerCase()
                        .match(/[a-z0-9]+/g) || [];

                    let commonWords = donationWords.filter(function(word) {
                        return word.length > 2 &&
                            needWords.includes(word);
                    });

                    if (commonWords.length > 0) {
                        matches.push({
                            donation: donationText,
                            need: needText
                        });
                    }
                });
            });

            return matches;
        }

        function displayMatches() {
            let container = document.getElementById("matches-list");
            let matches = findMatches();

            container.innerHTML = "";

            if (matches.length === 0) {
                let message = document.createElement("div");
                message.className = "match-card";

                let heading = document.createElement("h3");
                heading.textContent = "No matches yet!";

                let description = document.createElement("p");
                description.textContent =
                    "When donations match people's needs, they will appear here.";

                message.append(heading, description);
                container.appendChild(message);
                return;
            }

            matches.forEach(function(match) {
                let card = document.createElement("div");
                card.className = "match-card";

                let heading = document.createElement("h3");
                heading.textContent = "Potential Match";

                let donation = document.createElement("p");
                donation.textContent = "Donation: " + match.donation;

                let need = document.createElement("p");
                need.textContent = "Need: " + match.need;

                card.append(heading, donation, need);
                const impactKey = donation.textContent + "|" + need.textContent;

const impactSection = document.createElement("div");
impactSection.className = "impact-section";
const impactHeading = document.createElement("h3");
impactHeading.textContent = "How it helped:";

const impactDescription = document.createElement("p");
impactDescription.textContent = " ";
const impactInput = document.createElement("textarea");
impactInput.placeholder = "How it helped...";
impactInput.rows = 3;
const impactButton = document.createElement("button");

impactButton.textContent = "Update";

const impactList = document.createElement("div");

function displayImpactUpdates() {
    impactList.innerHTML = "";

    const allUpdates = JSON.parse(
        localStorage.getItem("impactUpdates") || "{}"
    );

    (allUpdates[impactKey] || []).forEach(function(update) {
        const updateCard = document.createElement("div");
        updateCard.className = "impact-update";

        const updateText = document.createElement("p");
        updateText.textContent = update.text;

        const updateDate = document.createElement("small");
        updateDate.textContent = update.date;

        updateCard.append(updateText, updateDate);
        impactList.appendChild(updateCard);
    });
}

impactButton.addEventListener("click", function() {
    const message = impactInput.value.trim();

    if (!message) {
        alert("Please write an impact update first.");
        return;
    }

    const allUpdates = JSON.parse(
        localStorage.getItem("impactUpdates") || "{}"
    );

    if (!allUpdates[impactKey]) {
        allUpdates[impactKey] = [];
    }

    allUpdates[impactKey].push({
        text: message,
        date: new Date().toLocaleDateString()
    });

    localStorage.setItem("impactUpdates", JSON.stringify(allUpdates));

    impactInput.value = "";
    displayImpactUpdates();
});
impactSection.append(
    impactHeading,
    impactDescription,
    impactInput,
    impactButton,
    impactList
);
card.appendChild(impactSection);
displayImpactUpdates();
                container.appendChild(card);
            });
        }

        displayMatches();
    </script>
</body>
</html>
