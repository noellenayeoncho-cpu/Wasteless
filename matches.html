<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches | WasteLess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>WasteLess</h1>
    </header>

    <nav>
        <a href="main.html">Home</a>
        <a href="needs.html">Needs</a>
        <a href="matches.html">Matches</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="update.html">Update</a>
        <a href="donate.html">Donate</a>
    </nav>

    <h2>Matches</h2>

    <div id="matches-list"></div>

    <script>
        function getSavedData(key) {
            try {
                let data = JSON.parse(localStorage.getItem(key));
                return Array.isArray(data) ? data : [];
            } catch {
                return [];
            }
        }

        function findMatches() {
            let donations = getSavedData("donationPosts");
            let needs = getSavedData("needPosts");
            let matches = [];

            donations.forEach(function(donation) {
                needs.forEach(function(need) {
                    let donationText = typeof donation === "string"
                        ? donation
                        : donation.text || "";

                    let needText = typeof need === "string"
                        ? need
                        : need.text || "";

                    let donationWords = donationText.toLowerCase().match(/[a-z0-9]+/g) || [];
                    let needWords = needText.toLowerCase().match(/[a-z0-9]+/g) || [];

                    let commonWords = donationWords.filter(function(word) {
                        return word.length > 2 && needWords.includes(word);
                    });

                    if (commonWords.length > 0) {
                        matches.push({
                            donation: donationText,
                            need: needText
                        });
                    }
                });
            });

            return matches;
        }

        function displayMatches() {
            let container = document.getElementById("matches-list");
            let matches = findMatches();

            container.innerHTML = "";

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="match-card">
                        <h3>No matches yet!</h3>
                        <p>Matching donation and need posts will appear here.</p>
                    </div>
                `;
                return;
            }

            matches.forEach(function(match) {
                let card = document.createElement("div");
                card.className = "match-card";

                let heading = document.createElement("h3");
                heading.textContent = "Potential Match";

                let donation = document.createElement("p");
                donation.textContent = "Donation: " + match.donation;

                let need = document.createElement("p");
                need.textContent = "Need: " + match.need;

                card.append(heading, donation, need);
                container.appendChild(card);
            });
        }

        displayMatches();
    </script>
</body>
</html>
